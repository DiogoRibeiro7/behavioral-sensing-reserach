name: Prepare v0.3.0 metadata

on:
  push:
    branches:
      - release/v0.3.0-version-metadata

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.3.0-version-metadata
          fetch-depth: 0

      - name: Apply release-candidate metadata changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")


          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8", newline="\n")


          # Package metadata. Keep the bumpversion tool aligned with the package.
          path = "pyproject.toml"
          text = read(path)
          assert text.count('version = "0.2.0"') == 1
          assert text.count('current_version = "0.2.0"') == 1
          text = text.replace('version = "0.2.0"', 'version = "0.3.0"', 1)
          text = text.replace(
              'current_version = "0.2.0"', 'current_version = "0.3.0"', 1
          )
          write(path, text)

          path = "sensor_modeling/__init__.py"
          text = read(path)
          assert text.count('__version__ = "0.2.0"') == 1
          write(path, text.replace('__version__ = "0.2.0"', '__version__ = "0.3.0"'))

          # Citation metadata becomes a 0.3.0 release candidate, but does not claim
          # a publication date before the release actually exists.
          path = "CITATION.cff"
          text = read(path)
          assert text.count('version: "0.2.0"') == 2
          assert text.count('date-released: "2026-08-30"') == 1
          text = text.replace('version: "0.2.0"', 'version: "0.3.0"')
          text = text.replace('date-released: "2026-08-30"\n', '')
          write(path, text)

          # Zenodo metadata: retain the stable concept DOI, point the lineage at
          # the immediately preceding archived release, and leave publication_date
          # unset until archival publication is possible.
          path = ".zenodo.json"
          data = json.loads(read(path))
          assert data["version"] == "0.2.0"
          assert data.get("publication_date") == "2026-08-30"
          data["version"] = "0.3.0"
          data.pop("publication_date", None)
          lineage = [
              item
              for item in data["related_identifiers"]
              if item.get("relation") == "isNewVersionOf"
          ]
          assert len(lineage) == 1
          assert lineage[0]["identifier"] == "10.5281/zenodo.17070042"
          lineage[0]["identifier"] = "10.5281/zenodo.22171268"
          data["notes"] = (
              "Research software. Not a medical device. Version 0.3.0 adds real-data "
              "evaluation and the frozen external test of the optional circadian prior. "
              "Across 43 primary external CASAS homes the median paired balanced-accuracy "
              "difference versus the v0.2 baseline was +0.0091 with a 95% household "
              "bootstrap interval [+0.0054, +0.0117], with 37 of 43 homes improved. "
              "The effect is small and does not establish clinical effectiveness or general "
              "smart-home performance. The current abstention mechanism remains a negative "
              "result: confidence is not sufficiently informative on real recordings and "
              "abstention is effectively silent in the confirmatory simulation. The project "
              "concept DOI remains 10.5281/zenodo.21337272. No 0.3.0 version DOI is recorded "
              "until Zenodo actually archives the release."
          )
          write(path, json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          # README: version/citation plus two stale evidence claims that would be
          # false in a 0.3.0 release.
          path = "README.md"
          text = read(path)
          old_scope = """> **This is a research toolkit, not a medical device.** Nothing it produces is
> a diagnosis, and no claim of clinical effectiveness is made or supported.
> Every quantitative result quoted here comes from the bundled simulator and
> has **not** been validated against real sensor data.
"""
          new_scope = """> **This is a research toolkit, not a medical device.** Nothing it produces is
> a diagnosis, and no claim of clinical effectiveness is made or supported.
> Quantitative results now include both simulator studies and CASAS recordings;
> each is labelled by evidence level. The frozen v0.3 candidate has been scored
> on 43 external homes, but that is not evidence of clinical effectiveness.
"""
          assert text.count(old_scope) == 1
          text = text.replace(old_scope, new_scope)
          assert text.count("version-0.2.0-informational") == 1
          text = text.replace("version-0.2.0-informational", "version-0.3.0-informational")

          old_ablation = """Every configuration is evaluated on identical simulated households, so the
comparison measures sensing rather than residents. On a four-seed sweep, adding
a person-bound wearable to six object sensors recovered most of the full
ten-sensor deployment's accuracy — the remaining gap is 0.012 balanced accuracy
(95% CI [+0.004, +0.020]), real but small — while removing the wearable cost
0.173 (95% CI [+0.140, +0.201]). A five-sensor configuration was the *best
calibrated* of all despite lower accuracy, which an accuracy-only evaluation
would have hidden. See [`docs/evaluation.md`](docs/evaluation.md).

> These numbers describe behaviour on the bundled simulator under its default
> parameters. They are not estimates of field performance. Nothing here has
> been validated against real sensor data — see
> [`docs/limitations.md`](docs/limitations.md).
"""
          new_ablation = """Every configuration is evaluated on identical simulated households, so the
comparison measures sensing rather than residents. The study-scale run uses 100
paired seeds. The eight-sensor configuration is 0.0073 balanced accuracy below
the full ten-sensor deployment (95% CI [+0.0063, +0.0083]), while the frozen
five-sensor configuration is 0.1707 lower. Calibration does not follow accuracy:
the five-sensor configuration remains the best calibrated despite the large
accuracy loss. See [`docs/evaluation.md`](docs/evaluation.md).

> These are simulator results and are not estimates of field performance. Real
> recordings and the frozen external validation are reported separately; see
> [`docs/real_data.md`](docs/real_data.md) and
> [`docs/limitations.md`](docs/limitations.md).
"""
          assert text.count(old_ablation) == 1
          text = text.replace(old_ablation, new_ablation)
          assert text.count("@software{ribeiro2025sensor,") == 1
          text = text.replace("@software{ribeiro2025sensor,", "@software{ribeiro2026sensor,")
          assert text.count("  version={0.2.0},") == 1
          text = text.replace("  version={0.2.0},", "  version={0.3.0},")
          write(path, text)

          # Close the accumulated Unreleased work under 0.3.0, but keep the
          # release date explicitly pending until publication actually happens.
          path = "CHANGELOG.md"
          text = read(path)
          marker = "## [Unreleased]\n\n"
          assert text.count(marker) == 1
          text = text.replace(
              marker,
              "## [Unreleased]\n\n"
              "## [0.3.0] - Unreleased\n\n"
              "Release date pending until the GitHub release is published. Zenodo "
              "archival is currently unavailable, so no 0.3.0 version DOI is recorded "
              "yet.\n\n",
              1,
          )
          added = "### Added\n"
          assert text.count(added) >= 2
          external = (
              "### Added\n"
              "- Recorded the frozen one-shot external validation of the optional "
              "circadian candidate on 43 primary CASAS homes: median paired "
              "balanced-accuracy difference +0.0091, 95% household bootstrap "
              "interval [+0.0054, +0.0117], with 37 homes improved, 6 worsened, "
              "and none unscoreable. This establishes transfer under the frozen "
              "CASAS evaluation contract, not clinical effectiveness or general "
              "smart-home performance.\n"
          )
          text = text.replace(added, external, 1)
          write(path, text)
          PY

      - name: Verify release metadata transformation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          import yaml

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          package = Path("sensor_modeling/__init__.py").read_text(encoding="utf-8")
          citation = yaml.safe_load(Path("CITATION.cff").read_text(encoding="utf-8"))
          zenodo = json.loads(Path(".zenodo.json").read_text(encoding="utf-8"))
          readme = Path("README.md").read_text(encoding="utf-8")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          versions = {
              re.search(r'^version = "([^"]+)"', pyproject, re.MULTILINE).group(1),
              re.search(r'__version__ = "([^"]+)"', package).group(1),
              citation["version"],
              citation["preferred-citation"]["version"],
              zenodo["version"],
              re.search(r"version=\{([^}]+)\}", readme).group(1),
          }
          assert versions == {"0.3.0"}, versions
          assert "date-released" not in citation
          assert "publication_date" not in zenodo
          assert "## [0.3.0] - Unreleased" in changelog
          assert "has **not** been validated against real sensor data" not in readme
          assert "Nothing here has\n> been validated against real sensor data" not in readme
          assert "10.5281/zenodo.21337272" in readme
          PY

      - name: Commit transformed metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml sensor_modeling/__init__.py CITATION.cff .zenodo.json README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "release: prepare v0.3.0 metadata candidate"
          git push origin HEAD:release/v0.3.0-version-metadata
